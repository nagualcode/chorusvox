name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Truce CLI
        run: cargo install truce-cli

      - name: Build and Install Bundles
        run: cargo truce install --vst3 --clap --au2

      - name: Package Artifacts
        run: |
          cd ~/Library/Audio/Plug-Ins
          zip -r -y ${{ github.workspace }}/ChorusVox-DecaBuddy-macOS.zip \
            "VST3/ChorusVox DecaBuddy.vst3" \
            "CLAP/ChorusVox DecaBuddy.clap" \
            "Components/ChorusVox DecaBuddy.component"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ChorusVox-DecaBuddy-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
