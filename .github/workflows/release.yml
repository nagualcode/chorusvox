name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag version to release (e.g. v0.2.11)"
        required: true

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Truce CLI
        run: cargo install truce-cli
      - name: Build and Install Bundles (VST3 & AUv2 for macOS)
        run: cargo truce install --vst3 --au2
      - name: Package macOS AU & VST3 Artifacts
        run: |
          cd ~/Library/Audio/Plug-Ins
          zip -r -y ${{ github.workspace }}/ChorusVox-DecaBuddy-macOS-AU-VST3.zip \
            "VST3/ChorusVox DecaBuddy.vst3" \
            "Components/ChorusVox DecaBuddy.component"
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: "ChorusVox DecaBuddy ${{ github.event.inputs.tag }} (macOS AU & VST3)"
          files: ChorusVox-DecaBuddy-macOS-AU-VST3.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
